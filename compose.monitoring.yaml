# Same-host integration with kmpoltorak-monitoring-tools. Start monitoring first.
services:
  atlas-api:
    ports: !override ["127.0.0.1:${MONITORED_HTTP_PORT:-18080}:8080"]
    networks:
      default:
      monitoring:
        aliases: [atlas-api]
  atlas-trainer:
    networks: [default, monitoring]
  timescaledb:
    ports: !reset []
  redis:
    ports: !reset []
  # ponytail: retain standalone monitoring for rollback; shared mode owns these services centrally.
  prometheus:
    profiles: !override [local-monitoring]
  grafana:
    profiles: !override [local-monitoring]
  alertmanager:
    profiles: !override [local-monitoring]

networks:
  monitoring:
    external: true
    name: kmpoltorak-monitoring-atlas

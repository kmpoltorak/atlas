name: CI

# Implements the "PR" and "Build" stages of the pipeline documented in docs/deployment.md.
# The "Push" and "Deploy" stages are explicitly out of scope for this project — they'd need a
# real container registry and production cluster credentials. See deploy/README.md's
# "Not yet done / out of scope" section.
#
# go-version is "stable" rather than pinned to go.mod's "go 1.26.1" on purpose: that
# directive is a minimum language version, not a toolchain pin, and Go only backports
# security fixes to its latest two major releases. Building/scanning with an old, unpatched
# toolchain would make the vulnerability scan flag stdlib CVEs no one can actually fix here.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint, vet, and test
    runs-on: ubuntu-latest
    # Real service containers for the persistence/cache integration tests
    # (internal/infrastructure/persistence, internal/infrastructure/cache) — without these,
    # TEST_DATABASE_DSN/TEST_REDIS_ADDR are unset and those tests just skip, silently
    # untested. Matches docker-compose.yml's timescaledb/redis service definitions.
    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB: atlas
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_DSN: "host=localhost port=5432 user=atlas password=atlas dbname=atlas sslmode=disable"
      TEST_REDIS_ADDR: "localhost:6379"
      # Same gating pattern as the two above, for internal/application/ml's real-inference tests
      # (onnx_integration_test.go). Without it those four tests skip silently, leaving the entire
      # LoadOnnxModel -> PredictCorrectionProbability path — the one that needs the real native
      # library, not the mocked onnxSession — untested everywhere. Path matches where the install
      # step below puts the .so.
      TEST_ONNXRUNTIME_LIB_PATH: "/opt/onnxruntime/lib/libonnxruntime.so"
      # Pinned to the same version Dockerfile's onnxruntime stage ships, so CI exercises the
      # library the image actually runs against rather than whatever is newest at the time.
      ONNXRUNTIME_VERSION: "1.28.0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache: true

      # GitHub Actions service containers start before checkout, so they can't mount
      # ./migrations the way docker-compose.yml's docker-entrypoint-initdb.d does — apply
      # them explicitly instead, with ON_ERROR_STOP so a broken migration fails CI loudly
      # rather than the container silently continuing (see migrations/001's fix history).
      - name: Apply database migrations
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          for f in migrations/*.sql; do
            echo "Applying $f"
            PGPASSWORD=atlas psql -h localhost -U atlas -d atlas -v ON_ERROR_STOP=1 -f "$f"
          done

      # The Go binding (yalue/onnxruntime_go) dlopens this at runtime rather than linking it, so
      # it's needed only for the tests, not for `go build` — which is why the build and vulnerability
      # scan jobs don't install it. libgomp1 is what onnxruntime's CPU execution provider links
      # against; it's already on the GitHub-hosted Ubuntu image via gcc, installed explicitly here
      # so a slimmer future runner image doesn't turn this into a confusing dlopen failure.
      - name: Install ONNX Runtime
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libgomp1
          curl -fsSL -o /tmp/ort.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ONNXRUNTIME_VERSION}/onnxruntime-linux-x64-${ONNXRUNTIME_VERSION}.tgz"
          sudo mkdir -p /opt/onnxruntime
          sudo tar -xzf /tmp/ort.tgz -C /opt/onnxruntime --strip-components=1
          rm /tmp/ort.tgz
          test -f "$TEST_ONNXRUNTIME_LIB_PATH" || {
            echo "libonnxruntime.so not found at $TEST_ONNXRUNTIME_LIB_PATH after extraction"
            exit 1
          }

      - name: Verify gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race ./...

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Only pandas/numpy, not training/requirements.txt: train.py defers its xgboost and
      # onnxmltools imports into main() precisely so the split logic can be tested without
      # installing ~500MB of training stack on every CI run. The versions match
      # training/requirements.txt so a pandas behaviour change can't pass here and fail there.
      - name: Test the training split
        run: |
          python -m pip install --quiet pandas==2.2.3 numpy==1.26.4
          python -m unittest discover -s training -p 'test_*.py' -v

  security-scan:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  docker-build:
    name: Docker build validation
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    steps:
      - uses: actions/checkout@v7

      - name: Build image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: atlas-api:ci

  # The trainer is built from a different base image than atlas-api, installs its Python
  # dependencies at runtime, and is only exercised when a human presses "Train new candidate" —
  # so a broken Dockerfile or a dependency set that no longer resolves would otherwise be found
  # by whoever eventually clicked the button. It does not train a model (that needs real
  # collected history); it checks the things that break silently. See the script's own comment.
  trainer-smoke-test:
    name: Trainer container smoke test
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    steps:
      - uses: actions/checkout@v7

      - name: Smoke test the trainer image
        run: ./scripts/trainer-smoke-test.sh

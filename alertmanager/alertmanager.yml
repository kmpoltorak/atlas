# Infrastructure alerts route to a Discord channel deliberately separate from
# DISCORD_WEBHOOK_URL (internal/app/alerts_loop.go's business alerts — recommendation changes),
# so infra noise (API restarts, error rates) never mixes with investment notifications.
#
# The webhook URL itself is never written here or committed anywhere: `webhook_url_file` points
# at a file docker-compose.yml's alertmanager service writes at container start from the
# ALERTMANAGER_DISCORD_WEBHOOK_URL env var (set it in your gitignored .env — see .env.example).
# Leave that var empty and this receiver still starts fine — it just fails to deliver (logged by
# Alertmanager, not fatal), the same non-fatal-optional-dependency pattern used everywhere else
# in this project (ML model, business Discord alerts, NBP rates all degrade the same way).
route:
  receiver: infra-discord
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: infra-discord
    discord_configs:
      - webhook_url_file: /tmp/discord_webhook_url

# Placeholder Alertmanager config — matches deploy/secret.yaml's pattern of a real, loadable
# template with no real destination wired in. Alerts route here and get grouped/deduplicated,
# but the "null" receiver below sends them nowhere until a real one is added.
#
# To actually deliver these alerts, replace the receiver below with e.g.:
#
#   receivers:
#     - name: infra-alerts
#       discord_configs:
#         - webhook_url: "https://discord.com/api/webhooks/..."
#       # or: slack_configs / webhook_configs / email_configs — see Alertmanager's docs.
#
# Deliberately a separate destination from DISCORD_WEBHOOK_URL (internal/app/alerts_loop.go's
# business alerts) rather than reusing it — which channel these should land in is Kris's call,
# not a code decision (see implementation-plan.md's Phase 7 status note).
route:
  receiver: "null"
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: "null"

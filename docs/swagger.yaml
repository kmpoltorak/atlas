basePath: /
definitions:
  atlas_internal_application_watchlist.ImportResult:
    properties:
      added:
        type: integer
      removed:
        type: integer
      skipped:
        type: integer
    type: object
  atlas_internal_domain.HealthStatus:
    properties:
      alertmanager:
        type: string
      database:
        type: string
      grafana:
        type: string
      prometheus:
        description: |-
          Prometheus/Alertmanager/Grafana are purely informational, like Trainer — omitted when
          their URL is configured empty, and never affect Status/the HTTP status code the way
          Database/Redis do: atlas-api doesn't depend on any of them to function, so Docker/
          Kubernetes restarting it because Grafana (say) is down would be exactly the wrong
          response to that outage.
        type: string
      redis:
        type: string
      service:
        type: string
      status:
        type: string
      trainer:
        description: |-
          Trainer is omitted entirely when TRAINER_URL isn't configured — the trainer sidecar is a
          genuinely optional component (see docker-compose.yml's "trainer" profile), so its absence
          is not reported as an error the way Database/Redis would be.
        type: string
    type: object
  atlas_internal_domain_backtesting.MLContribution:
    properties:
      drawdown_delta:
        description: |-
          DrawdownDelta is with-minus-without, so **negative is good** here (the model reduced the
          worst peak-to-trough loss). Signed consistently with the others rather than flipped for
          convenience, since a silently inverted sign is exactly the kind of thing that gets
          misread months later.
        type: number
      return_delta:
        description: |-
          ReturnDelta and SharpeDelta are with-minus-without. Positive means the model earned its
          place in the blend over this window; negative means the strategy would have done better
          ignoring it, which is a real and reportable outcome, not a bug to be hidden.
        type: number
      sharpe_delta:
        type: number
      with_ml_max_drawdown:
        type: number
      with_ml_sharpe_ratio:
        type: number
      with_ml_total_return:
        description: |-
          WithML mirrors the parent StrategyResult's own numbers (the run that was actually
          reported), repeated here so the comparison reads as a pair without cross-referencing.
        type: number
      with_ml_trade_count:
        type: integer
      with_ml_win_rate:
        type: number
      without_ml_max_drawdown:
        type: number
      without_ml_sharpe_ratio:
        type: number
      without_ml_total_return:
        type: number
      without_ml_trade_count:
        type: integer
      without_ml_win_rate:
        type: number
    type: object
  atlas_internal_domain_backtesting.MLEvaluation:
    properties:
      accuracy:
        type: number
      f1_score:
        type: number
      precision:
        type: number
      recall:
        type: number
      roc_auc:
        type: number
      sample_size:
        type: integer
    type: object
  atlas_internal_domain_backtesting.StrategyResult:
    properties:
      annual_return:
        type: number
      finished_at:
        type: string
      initial_capital:
        type: number
      losing_trades:
        type: integer
      max_drawdown:
        type: number
      ml_contribution:
        allOf:
        - $ref: '#/definitions/atlas_internal_domain_backtesting.MLContribution'
        description: |-
          MLContribution answers the question MLEvaluation cannot: does the model make money?
          Nil when no real trained model is loaded, same guard as MLEvaluation.
      ml_evaluation:
        $ref: '#/definitions/atlas_internal_domain_backtesting.MLEvaluation'
      sharpe_ratio:
        type: number
      started_at:
        type: string
      strategy_name:
        type: string
      strategy_version:
        type: string
      symbol:
        type: string
      total_return:
        type: number
      trade_count:
        type: integer
      trades:
        items:
          $ref: '#/definitions/atlas_internal_domain_backtesting.Trade'
        type: array
      volatility:
        type: number
      win_rate:
        type: number
      winning_trades:
        type: integer
    type: object
  atlas_internal_domain_backtesting.Trade:
    properties:
      action:
        type: string
      confidence:
        type: number
      price:
        type: number
      quantity:
        type: number
      reason:
        type: string
      symbol:
        type: string
      timestamp:
        type: string
    type: object
  atlas_internal_domain_backtesting.WalkForwardResult:
    properties:
      best_thresholds:
        $ref: '#/definitions/atlas_internal_domain_decision.Thresholds'
      candidates_evaluated:
        type: integer
      symbol:
        type: string
      test:
        $ref: '#/definitions/atlas_internal_domain_backtesting.StrategyResult'
      train:
        $ref: '#/definitions/atlas_internal_domain_backtesting.StrategyResult'
      validate:
        $ref: '#/definitions/atlas_internal_domain_backtesting.StrategyResult'
    type: object
  atlas_internal_domain_decision.Recommendation:
    properties:
      action:
        type: string
      confidence:
        type: number
      market_condition:
        description: |-
          MarketCondition is BULL/BEAR/SIDEWAYS (see ml.ClassifyMarketCondition) — a deterministic
          ADX+EMA technical rule, not a trained model. Empty string when there isn't enough history
          to compute it (see ml.ClassifyMarketCondition's own warm-up requirement).
        type: string
      ml_model_version:
        description: |-
          MLModelVersion is the actual ML model that produced MLScore (ml.Prediction.ModelVersion —
          e.g. a real trained model's version, or ml.StubModelVersion when none is loaded/wired in).
          Empty when ML wasn't part of scoring at all (NewOrchestrator without ML — see
          NewOrchestratorWithML), distinct from the stub case where ML ran but with a placeholder
          model.
        type: string
      ml_score:
        type: number
      model_version:
        description: |-
          ModelVersion identifies the decision-engine scoring logic itself (weights, thresholds —
          see Orchestrator.EngineVersion), not the ML sub-model that fed MLScore above. Always
          "atlas-decision-v1" today since the engine has never been re-versioned — don't confuse a
          constant engine tag with "no ML model is being used."
        type: string
      portfolio_score:
        type: number
      reason:
        items:
          type: string
        type: array
      risk_score:
        description: |-
          RiskScore is a portfolio-wide risk signal (see portfolio.UseCase.ComputeRisk), distinct
          from PortfolioScore (a single symbol's own P&L) — it reflects overall exposure/drawdown/
          volatility across every held position, per docs/decision_engine.md's "Risk Context" being
          a portfolio-wide concept. On the same [0,1] scale as the other components (higher = more
          supportive of buying).
        type: number
      score:
        description: |-
          Score is the final blended score (Technical/ML/Portfolio/Risk, see Orchestrator.
          blendMLAndPortfolio); the component fields below are the inputs that produced it. All
          five are zero when a recommendation short-circuits before scoring (e.g. no bar data).
        type: number
      symbol:
        type: string
      technical_score:
        type: number
    type: object
  atlas_internal_domain_decision.Thresholds:
    properties:
      lean_bearish:
        type: number
      lean_bullish:
        type: number
      low_ml_confidence:
        type: number
      strong_bearish:
        type: number
      strong_bullish:
        type: number
    type: object
  atlas_internal_domain_ml.Prediction:
    properties:
      confidence:
        type: number
      correction_probability:
        description: |-
          CorrectionProbability is the model's raw output — the probability of a price correction
          within the training label's horizon (see application/ml.CorrectionLabelParams). Zero
          when no trained model is loaded (the RSI-derived stub has no such concept).
        type: number
      model_version:
        type: string
      recovery_model_version:
        description: |-
          RecoveryModelVersion is set only when a recovery model actually ran (see
          application/ml.UseCase.Predict), independent of ModelVersion above — mirrors
          ModelVersion's role of letting persistence tell "not computed" (empty) apart from "computed
          as exactly 0" (see infrastructure/persistence/ml.go's SavePrediction).
        type: string
      recovery_probability:
        description: |-
          RecoveryProbability is the probability that a price correction recovers to its pre-drop
          level within application/ml.RecoveryLabelParams' horizon (see
          application/ml.ComputeRecoveryLabel for the label definition). Real when a recovery model
          is loaded (RECOVERY_MODEL_PATH — a separate, optional model from ModelPath/MODEL_PATH's
          correction-probability one), 0 otherwise. Always the thinner and more skewed of the two
          models by construction, since a recovery label only exists for bars where a correction
          actually happened — treat its metrics with more scepticism than the correction model's,
          not the same amount. See docs/ml.md's Implementation status note for the current numbers.
        type: number
      score:
        description: |-
          Score is a bullish-lean signal in [0,1] for the decision engine's blend (see
          decision.Orchestrator.blendMLAndPortfolio) — higher means more supportive of buying.
          When a real correction-probability model is loaded, Score is derived as
          1-CorrectionProbability so existing blend semantics don't change; the deterministic
          stub still derives it directly from RSI when no model is loaded.
        type: number
      symbol:
        type: string
    type: object
  atlas_internal_domain_portfolio.Transaction:
    properties:
      currency:
        description: |-
          Currency is validated against currency.Valid by RecordTransaction; defaults to
          currency.Base (PLN) when empty, so existing callers that don't set it keep working
          unchanged (the same non-fatal-optional stance the rest of this codebase takes).
        type: string
      id:
        description: |-
          ID is empty for a transaction not yet recorded (e.g. a caller-built value passed to
          RecordTransaction); RecordTransaction assigns one before it's stored.
        type: string
      price:
        description: Price is in Currency, exactly as entered — the source of truth
          for display/audit.
        type: number
      price_in_pln:
        description: |-
          PriceInPLN is Price converted to currency.Base at the moment this transaction was
          recorded (via exchangerate.UseCase.ToBase), using whatever NBP rate was current then —
          not recomputed later. This is what position math (UseCase.applyTransaction) actually
          uses, so a position's weighted-average cost never silently drifts from FX movement alone;
          it only changes when a real transaction is added or removed. Equal to Price when
          Currency is PLN.
        type: number
      quantity:
        type: number
      symbol:
        type: string
      timestamp:
        type: string
      type:
        type: string
    type: object
info:
  contact: {}
  description: |-
    Decision-support trading-signal API: market data, portfolio, watchlist,
    recommendations, ML predictions, and backtests. Atlas never executes trades —
    every recommendation is advisory only.

    Every route except /health, /metrics, /login, and /static/* requires a session
    cookie (see internal/app/auth_middleware.go) whenever ADMIN_USERNAME/
    ADMIN_PASSWORD_HASH are set — log in via the dashboard in the same browser first,
    then "Try it out" here reuses that session automatically.
  title: Atlas API
  version: "1.0"
paths:
  /alerts:
    get:
      description: |-
        Every watchlist symbol whose latest recommendation isn't HOLD, as of the last
        background alert-poll cycle (ALERT_POLL_INTERVAL_SECONDS, default 300s) — not
        recomputed live on this request.
      produces:
      - application/json
      responses:
        "200":
          description: '{"alerts": [...]}'
          schema:
            additionalProperties: true
            type: object
      summary: List current actionable alerts
      tags:
      - Recommendations
  /backtests:
    get:
      description: |-
        Simulates the live decision engine's current thresholds over historical bars and
        persists the result to backtest history.
      parameters:
      - description: Ticker, e.g. AAPL
        in: query
        name: symbol
        required: true
        type: string
      - description: 'Lookback in days (default: 180)'
        in: query
        name: window
        type: integer
      - description: 'Starting capital (default: 10000)'
        in: query
        name: capital
        type: number
      - description: 'Strategy name label (default: atlas-orchestrator)'
        in: query
        name: strategy
        type: string
      - description: 'Strategy version label (default: v1)'
        in: query
        name: version
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/atlas_internal_domain_backtesting.StrategyResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: provider unreachable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Run a backtest simulation for a symbol
      tags:
      - Backtests
  /backtests/history:
    get:
      description: |-
        Reads previously persisted backtest runs (migrations/005), newest first — does
        not execute a new simulation.
      parameters:
      - description: Ticker, e.g. AAPL
        in: query
        name: symbol
        required: true
        type: string
      - description: 'Max rows to return (default: 20)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: '{"runs": [...]}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List past backtest runs for a symbol
      tags:
      - Backtests
  /backtests/walkforward:
    get:
      description: |-
        Splits the window 60/20/20 (train/validate/test) and optimizes candidate
        thresholds against real historical data — a report for a human to review, not
        persisted or replayed like a plain backtest.
      parameters:
      - description: Ticker, e.g. AAPL
        in: query
        name: symbol
        required: true
        type: string
      - description: 'Lookback in days (default: 500)'
        in: query
        name: window
        type: integer
      - description: 'Starting capital (default: 10000)'
        in: query
        name: capital
        type: number
      - description: 'Strategy name label (default: atlas-orchestrator)'
        in: query
        name: strategy
        type: string
      - description: 'Strategy version label (default: v1)'
        in: query
        name: version
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/atlas_internal_domain_backtesting.WalkForwardResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: provider unreachable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Run a walk-forward backtest with threshold optimization
      tags:
      - Backtests
  /health:
    get:
      description: |-
        Pings the database and cache directly (not a bare liveness check). No
        authentication required — see auth_middleware.go's publicPaths.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/atlas_internal_domain.HealthStatus'
        "503":
          description: database or redis unreachable
          schema:
            $ref: '#/definitions/atlas_internal_domain.HealthStatus'
      summary: Health check
      tags:
      - System
  /portfolio:
    delete:
      consumes:
      - application/json
      description: |-
        GET returns every current position plus the portfolio-wide risk snapshot.
        POST records a BUY/SELL transaction (JSON body: portfolio.Transaction — symbol,
        type, quantity, price, currency are required; PLN needs no currency conversion
        setup) and updates the position; a transaction that sells a position down to zero
        removes it from the position list, keeping the transaction in history.
        DELETE (?symbol=) clears a symbol's current position aggregate without touching
        transaction history — distinct from selling it via a POST.
      parameters:
      - description: Ticker to remove (DELETE only)
        in: query
        name: symbol
        type: string
      - description: Transaction to record (POST only)
        in: body
        name: transaction
        schema:
          $ref: '#/definitions/atlas_internal_domain_portfolio.Transaction'
      produces:
      - application/json
      responses:
        "200":
          description: 'GET: {"positions": [...], "risk": {...}}; DELETE: {"status":
            "removed"}'
          schema:
            additionalProperties: true
            type: object
        "201":
          description: 'POST: {"status": "recorded"}'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get portfolio positions and risk, record a transaction, or remove a
        position
      tags:
      - Portfolio
    get:
      consumes:
      - application/json
      description: |-
        GET returns every current position plus the portfolio-wide risk snapshot.
        POST records a BUY/SELL transaction (JSON body: portfolio.Transaction — symbol,
        type, quantity, price, currency are required; PLN needs no currency conversion
        setup) and updates the position; a transaction that sells a position down to zero
        removes it from the position list, keeping the transaction in history.
        DELETE (?symbol=) clears a symbol's current position aggregate without touching
        transaction history — distinct from selling it via a POST.
      parameters:
      - description: Ticker to remove (DELETE only)
        in: query
        name: symbol
        type: string
      - description: Transaction to record (POST only)
        in: body
        name: transaction
        schema:
          $ref: '#/definitions/atlas_internal_domain_portfolio.Transaction'
      produces:
      - application/json
      responses:
        "200":
          description: 'GET: {"positions": [...], "risk": {...}}; DELETE: {"status":
            "removed"}'
          schema:
            additionalProperties: true
            type: object
        "201":
          description: 'POST: {"status": "recorded"}'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get portfolio positions and risk, record a transaction, or remove a
        position
      tags:
      - Portfolio
    post:
      consumes:
      - application/json
      description: |-
        GET returns every current position plus the portfolio-wide risk snapshot.
        POST records a BUY/SELL transaction (JSON body: portfolio.Transaction — symbol,
        type, quantity, price, currency are required; PLN needs no currency conversion
        setup) and updates the position; a transaction that sells a position down to zero
        removes it from the position list, keeping the transaction in history.
        DELETE (?symbol=) clears a symbol's current position aggregate without touching
        transaction history — distinct from selling it via a POST.
      parameters:
      - description: Ticker to remove (DELETE only)
        in: query
        name: symbol
        type: string
      - description: Transaction to record (POST only)
        in: body
        name: transaction
        schema:
          $ref: '#/definitions/atlas_internal_domain_portfolio.Transaction'
      produces:
      - application/json
      responses:
        "200":
          description: 'GET: {"positions": [...], "risk": {...}}; DELETE: {"status":
            "removed"}'
          schema:
            additionalProperties: true
            type: object
        "201":
          description: 'POST: {"status": "recorded"}'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get portfolio positions and risk, record a transaction, or remove a
        position
      tags:
      - Portfolio
  /predictions:
    get:
      description: |-
        Runs the ML inference path alone (no technical/portfolio/risk blend, no
        BUY/SELL/HOLD decision) against freshly collected bars — the deterministic
        RSI-derived stub when no trained model is loaded (see internal/application/ml).
      parameters:
      - description: Ticker, e.g. AAPL
        in: query
        name: symbol
        required: true
        type: string
      - description: 'Lookback in days (default: COLLECTOR_WINDOW_DAYS)'
        in: query
        name: window
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/atlas_internal_domain_ml.Prediction'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: provider unreachable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a raw ML prediction for a symbol
      tags:
      - Machine Learning
  /prices:
    get:
      description: |-
        Collects hourly bars from the market data provider (cached — see collectBars),
        persists them, and returns them oldest-first.
      parameters:
      - description: Ticker, e.g. AAPL
        in: query
        name: symbol
        required: true
        type: string
      - description: 'Lookback in days (default: COLLECTOR_WINDOW_DAYS)'
        in: query
        name: window
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: '{"symbol": "AAPL", "bars": [...]}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: provider unreachable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get OHLCV price bars for a symbol
      tags:
      - Market Data
  /recommendations:
    get:
      description: |-
        Runs the full technical+ML+portfolio+risk pipeline against freshly collected
        bars and returns an explainable decision.Recommendation. Decision-support only —
        Atlas never executes trades.
      parameters:
      - description: Ticker, e.g. AAPL
        in: query
        name: symbol
        required: true
        type: string
      - description: 'Lookback in days (default: COLLECTOR_WINDOW_DAYS)'
        in: query
        name: window
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/atlas_internal_domain_decision.Recommendation'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: provider unreachable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a live BUY/SELL/HOLD recommendation for a symbol
      tags:
      - Recommendations
  /symbols:
    get:
      description: Returns every ticker currently on the watchlist, as a plain string
        list.
      produces:
      - application/json
      responses:
        "200":
          description: '{"symbols": ["AAPL", "MSFT"]}'
          schema:
            additionalProperties:
              items:
                type: string
              type: array
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List watchlist symbols
      tags:
      - Market Data
  /transactions:
    delete:
      description: |-
        GET returns every recorded transaction. DELETE (?id=) removes one and replays the
        affected symbol's remaining transactions to recompute its position from scratch.
      parameters:
      - description: Transaction id to remove (DELETE only)
        in: query
        name: id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'GET: {"transactions": [...]}; DELETE: {"status": "removed"}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List transaction history, or delete one and recompute its position
      tags:
      - Portfolio
    get:
      description: |-
        GET returns every recorded transaction. DELETE (?id=) removes one and replays the
        affected symbol's remaining transactions to recompute its position from scratch.
      parameters:
      - description: Transaction id to remove (DELETE only)
        in: query
        name: id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'GET: {"transactions": [...]}; DELETE: {"status": "removed"}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List transaction history, or delete one and recompute its position
      tags:
      - Portfolio
  /watchlist:
    delete:
      consumes:
      - application/json
      description: |-
        GET returns every tracked item. POST adds a symbol (JSON body: {"symbol": "AAPL"}).
        DELETE (?symbol=) untracks one. Adding an already-tracked symbol, or removing an
        untracked one, is a no-op rather than an error.
      parameters:
      - description: Ticker to remove (DELETE only)
        in: query
        name: symbol
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'GET: {"items": [...]}; DELETE: {"status": "removed"}'
          schema:
            additionalProperties: true
            type: object
        "201":
          description: 'POST: {"status": "added"}'
          schema:
            additionalProperties:

apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-api
  namespace: atlas
  labels:
    app: atlas-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: atlas-api
  template:
    metadata:
      labels:
        app: atlas-api
    spec:
      # ONE replica, and Recreate so a rollout never overlaps two. Everything concurrency needs is
      # built — a database lease with a fencing epoch, a durable alert cursor and outbox,
      # DB-authoritative portfolio state, cancellation that reaches in-flight work — and each part
      # is tested on its own. What does not exist is a test running two live processes against one
      # database through a lease handover. Until that exists and passes, this stays at 1; see
      # docs/deployment.md's "Scaling", which says the same thing rather than claiming otherwise.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: atlas-api
          # Replace with the real registry/tag once a CI push stage is wired up
          # (.github/workflows/ci.yml intentionally stops short of pushing/deploying).
          image: REGISTRY/atlas-api:latest
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: atlas-api-config
            - secretRef:
                name: atlas-api-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

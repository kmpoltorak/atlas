apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-api
  namespace: atlas
  labels:
    app: atlas-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: atlas-api
  template:
    metadata:
      labels:
        app: atlas-api
    spec:
      # ONE replica, and Recreate so a rollout never overlaps two. Everything concurrency needs is
      # built — a database lease with a fencing epoch, a durable alert cursor and outbox,
      # DB-authoritative portfolio state, cancellation that reaches in-flight work — and each part
      # is tested on its own. What does not exist is a test running two live processes against one
      # database through a lease handover. Until that exists and passes, this stays at 1; see
      # docs/deployment.md's "Scaling", which says the same thing rather than claiming otherwise.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: atlas-api
          # Replace with the real registry/tag once a CI push stage is wired up
          # (.github/workflows/ci.yml intentionally stops short of pushing/deploying).
          image: REGISTRY/atlas-api:latest
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: atlas-api-config
            - secretRef:
                name: atlas-api-secrets
          env:
            # Lets the Go GC work to the container limit instead of letting garbage double the heap
            # first. Kept below the limit to leave room for the non-heap part of the process.
            - name: GOMEMLIMIT
              value: "1280MiB"
          # The memory limit is sized for a restore, not for steady state. Restoring a backup holds
          # the upload plus the rows being inserted; measured on a disposable database with
          # GOMEMLIMIT set, a 51 MiB backup peaked at 258 MiB of heap and a 199 MiB one (the upload
          # cap is 200 MiB, maxBackupRestoreBytes) at 996 MiB. The old 256Mi limit would have
          # OOM-killed the pod on a restore far below the cap. Everyday use stays near the request.
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "1536Mi"
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # The one writable path. A multipart upload larger than the 1 MiB ParseMultipartForm
            # keeps in memory is spooled to os.TempDir(); with a read-only root filesystem and no
            # /tmp, restoring any real backup failed while parsing the form.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            # One upload at the 200 MiB cap plus headroom; the kubelet evicts the pod rather than
            # letting it fill the node's disk.
            sizeLimit: 256Mi

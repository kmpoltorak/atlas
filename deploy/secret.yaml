# TEMPLATE ONLY — per docs/deployment.md: "Secrets must never be stored in Git."
#
# Do not fill in real values and commit them. In production, create this Secret out-of-band:
#   kubectl create secret generic atlas-api-secrets -n atlas \
#     --from-literal=DATABASE_PASSWORD='...' \
#     --from-literal=DISCORD_WEBHOOK_URL='...' \
#     --from-literal=ADMIN_PASSWORD_HASH='...'
# or manage it with a tool designed for this (Sealed Secrets, External Secrets Operator,
# SOPS, your cloud provider's secret manager, etc.). This file exists only to document the
# expected keys and to give `kubectl apply -f deploy/` something to fail on obviously if
# someone forgets to replace it.
apiVersion: v1
kind: Secret
metadata:
  name: atlas-api-secrets
  namespace: atlas
type: Opaque
stringData:
  DATABASE_PASSWORD: "REPLACE_ME"
  DISCORD_WEBHOOK_URL: "REPLACE_ME"
  # bcrypt hash, not a plaintext password — generate with `go run ./cmd/generate-admin-credentials`
  # (see README.md "Login credentials"). Leave unset (omit this key, or leave blank and don't set
  # ADMIN_USERNAME in configmap.yaml) to run with no login gate at all.
  ADMIN_PASSWORD_HASH: "REPLACE_ME"

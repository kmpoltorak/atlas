# Automates the manual pg_dump procedure documented in deploy/RUNBOOK.md — runs daily, keeps the
# last 7 days of dumps on a PersistentVolumeClaim. This does not solve off-cluster/object-storage
# backup (S3/GCS/etc.) — where the PVC itself lives, and whether it's durable enough on its own,
# is a cluster/storage-class decision outside this repo's scope (same reasoning as deploy/README.md's
# "TimescaleDB runs via a managed service" note). Copying dumps off-cluster from this PVC is a
# reasonable next step once a target/schedule for that is chosen.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: atlas-db-backups
  namespace: atlas
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # A handful of `pg_dump -F c` dumps of Atlas's data (prices, positions, transactions,
      # watchlist) at 7-day retention — generous headroom for a single-user portfolio tool.
      storage: 5Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: atlas-db-backup
  namespace: atlas
spec:
  # Daily at 02:00 (cluster timezone) — matches docs/deployment.md's Backup Strategy cadence for
  # TimescaleDB ("Daily", see deploy/RUNBOOK.md's table).
  schedule: "0 2 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pg-dump
              # Matches docker-compose.yml's TimescaleDB image so pg_dump's version always lines
              # up with what produced the data.
              image: timescale/timescaledb:latest-pg16
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  timestamp="$(date +%F-%H%M%S)"
                  file="/backups/atlas-${timestamp}.dump"
                  echo "Backing up ${DATABASE_NAME} to ${file}"
                  PGPASSWORD="${DATABASE_PASSWORD}" pg_dump \
                    -h "${DATABASE_HOST}" -p "${DATABASE_PORT}" \
                    -U "${DATABASE_USER}" -d "${DATABASE_NAME}" \
                    -F c -f "${file}"
                  echo "Backup complete: $(ls -lh "${file}")"
                  echo "Pruning dumps older than ${RETENTION_DAYS} days"
                  find /backups -name 'atlas-*.dump' -mtime "+${RETENTION_DAYS}" -delete -print
              env:
                - name: DATABASE_HOST
                  valueFrom:
                    configMapKeyRef: { name: atlas-api-config, key: DATABASE_HOST }
                - name: DATABASE_PORT
                  valueFrom:
                    configMapKeyRef: { name: atlas-api-config, key: DATABASE_PORT }
                - name: DATABASE_NAME
                  valueFrom:
                    configMapKeyRef: { name: atlas-api-config, key: DATABASE_NAME }
                - name: DATABASE_USER
                  valueFrom:
                    configMapKeyRef: { name: atlas-api-config, key: DATABASE_USER }
                - name: DATABASE_PASSWORD
                  valueFrom:
                    secretKeyRef: { name: atlas-api-secrets, key: DATABASE_PASSWORD }
                - name: RETENTION_DAYS
                  value: "7"
              volumeMounts:
                - name: backups
                  mountPath: /backups
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: atlas-db-backups

apiVersion: v1
kind: ConfigMap
metadata:
  name: atlas-api-config
  namespace: atlas
data:
  SERVER_PORT: "8080"
  LOG_LEVEL: "info"
  DATABASE_HOST: "timescaledb"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "atlas"
  DATABASE_USER: "atlas"
  # Cluster traffic crosses nodes, so encrypted, authenticated links to the database and cache are
  # a startup requirement here (config.Validate refuses to start otherwise). Deliberately its own
  # flag rather than implied by COOKIE_SECURE — see config.Config.RequireBackendTLS.
  REQUIRE_BACKEND_TLS: "true"
  # "require" encrypts without verifying the server certificate; use "verify-full" once the
  # database presents a certificate signed by a CA the pod trusts.
  DATABASE_SSLMODE: "require"
  # Connection-pool bounds. Empty means the defaults in persistence.PoolLimits (20 open, 5 idle,
  # 30 minute lifetime) — conservative starting points, not measured optima. Keep the total across
  # every replica and every other client below the database's own max_connections.
  DATABASE_MAX_OPEN_CONNS: ""
  DATABASE_MAX_IDLE_CONNS: ""
  DATABASE_CONN_MAX_LIFETIME_MINUTES: ""
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_TLS: "true"
  COLLECTOR_WINDOW_DAYS: "30"
  ALERT_POLL_INTERVAL_SECONDS: "300"
  # Days of recomputable history (indicators, recommendations, predictions) to keep. "0" keeps
  # everything. The alert loop writes one recommendation per watched symbol per poll, so a
  # long-lived deployment should set a real window here — see config.Config.DerivedRetentionDays.
  DERIVED_RETENTION_DAYS: "365"
  # Both "": no trained model available is a normal, non-fatal startup state (see
  # internal/config/config.go). Set MODEL_PATH/RECOVERY_MODEL_PATH to a path mounted into the
  # container (e.g. via an extra volume) if a trained ONNX model is deployed — the two are
  # independent, either/both/neither may be set.
  MODEL_PATH: ""
  RECOVERY_MODEL_PATH: ""
  LIBONNXRUNTIME_PATH: ""
  # Directory the Account dashboard page scans for selectable trained models (see
  # internal/application/ml.ListModels) — should match wherever MODEL_PATH/RECOVERY_MODEL_PATH
  # above are mounted from. Only used for discovery/display, not for deciding what loads.
  ML_MODELS_DIR: "/models"
  # "": auth disabled, no login gate at all — the same non-fatal-optional pattern. Set to enable
  # the dashboard/API login gate; ADMIN_PASSWORD_HASH (the matching secret) lives in secret.yaml.
  ADMIN_USERNAME: "admin"
  AUTH_DISABLED: "false"
  # "true" here (unlike docker-compose.yml's local-dev default of "false") because ingress.yaml
  # terminates TLS in front of this deployment — the session cookie only makes sense as Secure
  # when the connection actually is HTTPS.
  COOKIE_SECURE: "true"

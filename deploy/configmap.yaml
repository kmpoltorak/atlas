apiVersion: v1
kind: ConfigMap
metadata:
  name: atlas-api-config
  namespace: atlas
data:
  SERVER_PORT: "8080"
  LOG_LEVEL: "info"
  DATABASE_HOST: "timescaledb"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "atlas"
  DATABASE_USER: "atlas"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  PROMETHEUS_ENABLED: "true"
  MARKET_PROVIDER: "yahoo"
  COLLECTOR_WINDOW_DAYS: "30"
  ALERT_POLL_INTERVAL_SECONDS: "300"
  # Both "": no trained model available is a normal, non-fatal startup state (see
  # internal/config/config.go). Set MODEL_PATH to a path mounted into the container (e.g. via
  # an extra volume) if a trained ONNX model is deployed.
  MODEL_PATH: ""
  LIBONNXRUNTIME_PATH: ""
  # "": auth disabled, no login gate at all — the same non-fatal-optional pattern. Set to enable
  # the dashboard/API login gate; ADMIN_PASSWORD_HASH (the matching secret) lives in secret.yaml.
  ADMIN_USERNAME: ""

apiVersion: v1
kind: ConfigMap
metadata:
  name: atlas-api-config
  namespace: atlas
data:
  SERVER_PORT: "8080"
  LOG_LEVEL: "info"
  DATABASE_HOST: "timescaledb"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "atlas"
  DATABASE_USER: "atlas"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  PROMETHEUS_ENABLED: "true"
  MARKET_PROVIDER: "yahoo"
  COLLECTOR_WINDOW_DAYS: "30"
  ALERT_POLL_INTERVAL_SECONDS: "300"

# The host below is the example.com placeholder from docs/deployment.md's
# "Kubernetes Architecture" section — replace with the real domain before applying.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atlas-api-ingress
  namespace: atlas
  annotations:
    # Adjust to whatever ingress controller/TLS issuer the cluster actually runs.
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Matched to the application's own limits, which ingress-nginx would otherwise undercut: its
    # default 1m body size rejects every real backup restore with 413, and its 60s proxy timeouts
    # cut off a backup or restore that the application allows two minutes
    # (backupOperationTimeout). 202m = the 200 MiB restore cap plus the form's own overhead.
    nginx.ingress.kubernetes.io/proxy-body-size: "202m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "150"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "150"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - atlas.example.com
      secretName: atlas-api-tls
  rules:
    - host: atlas.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: atlas-api-service
                port:
                  name: http

{{define "head"}}
<link href="/static/css/bootstrap.min.css" rel="stylesheet">
<script>
  // Bootstrap 5.3's official color-mode pattern, applied before first paint (in <head>, not
  // deferred) so there's no flash of the wrong theme. "auto" tracks the OS
  // prefers-color-scheme live; an explicit light/dark choice is remembered in localStorage.
  (() => {
    'use strict'
    const getStoredTheme = () => localStorage.getItem('atlas-theme')
    const setStoredTheme = theme => localStorage.setItem('atlas-theme', theme)
    const preferredTheme = () => window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
    const applyTheme = theme => {
      document.documentElement.setAttribute('data-bs-theme', theme === 'auto' ? preferredTheme() : theme)
    }
    applyTheme(getStoredTheme() || 'auto')
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      const stored = getStoredTheme()
      if (!stored || stored === 'auto') applyTheme('auto')
    })
    window.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('[data-theme-value]').forEach(el => {
        el.addEventListener('click', () => {
          const theme = el.getAttribute('data-theme-value')
          setStoredTheme(theme)
          applyTheme(theme)
        })
      })
    })
  })()
</script>
{{end}}

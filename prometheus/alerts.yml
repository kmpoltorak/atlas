# Infrastructure-level alerting rules — distinct from the business alerts already sent to
# Discord by internal/app/alerts_loop.go (recommendation changes for watched symbols). These
# fire on the health of Atlas itself: is it up, is it crash-looping, is it erroring a lot.
# Loaded through prometheus.yml's `rule_files` by the Compose stack's own Prometheus.
groups:
  - name: atlas-infrastructure
    rules:
      - alert: AtlasAPIDown
        expr: up{job="atlas-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Atlas API is unreachable"
          description: "Prometheus has not been able to scrape atlas-api for 2 minutes."

      - alert: AtlasAPIFlapping
        # A proxy for crash-looping that works with only the atlas-api scrape target already
        # configured below — no extra scrape config needed. `changes()` counts up/down
        # transitions, so a container repeatedly dying and restarting shows up here even though each
        # individual outage might be too short for AtlasAPIDown's 2m `for` to fire.
        expr: changes(up{job="atlas-api"}[15m]) > 4
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Atlas API is flapping"
          description: "atlas-api's up/down state changed more than 4 times in 15 minutes — likely crash-looping."

      - alert: AtlasHighErrorRate
        expr: |
          sum(rate(atlas_api_requests_total{status=~"5.."}[5m]))
            /
          sum(rate(atlas_api_requests_total[5m]))
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Atlas API error rate above 5%"
          description: "More than 5% of requests have returned a 5xx status over the last 5 minutes."

      - alert: AtlasAlertPollErrors
        # atlas_alert_poll_errors_total (internal/app/alerts_loop.go's pollAlertsOnce) only
        # increments on a cycle-level Evaluate() failure (e.g. the market data provider is
        # unreachable), not per-symbol errors within an otherwise-successful cycle — so any
        # increase here is already a real, cycle-wide problem, not noise.
        expr: increase(atlas_alert_poll_errors_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Atlas background alert polling is failing"
          description: "The watchlist alert-poll loop failed to evaluate at least once in the last 15 minutes."

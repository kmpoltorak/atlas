global:
  scrape_interval: 15s

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "atlas-api"
    static_configs:
      - targets: ["atlas-api:8080"]
  # atlas-trainer runs in the default Compose stack; if it is stopped, this target shows as
  # down (up{job="atlas-trainer"} == 0), which is expected rather than a broken scrape. Exposes
  # atlas_trainer_runs_total/atlas_trainer_run_duration_seconds/
  # atlas_trainer_last_run_timestamp_seconds (cmd/trainer/main.go).
  - job_name: "atlas-trainer"
    static_configs:
      - targets: ["atlas-trainer:8091"]

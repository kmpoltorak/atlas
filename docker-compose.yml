services:
  atlas-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atlas-api
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      LOG_LEVEL: info
      DATABASE_HOST: timescaledb
      DATABASE_PORT: "5432"
      DATABASE_NAME: atlas
      DATABASE_USER: atlas
      DATABASE_PASSWORD: atlas
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      PROMETHEUS_ENABLED: "true"
      MARKET_PROVIDER: yahoo
      DISCORD_WEBHOOK_URL: ""
      ALERT_POLL_INTERVAL_SECONDS: "300"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: atlas-timescaledb
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      # Official postgres/timescaledb images auto-run any .sql files found here, in
      # lexical order, but only against a fresh (empty) data volume. For an existing
      # volume, apply new migrations manually — this isn't a real migration tool with
      # version tracking, just the standard Docker Compose bootstrap mechanism.
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: atlas-redis
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.0.0
    container_name: atlas-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: atlas-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  timescaledb-data:
  redis-data:
  prometheus-data:
  grafana-data:

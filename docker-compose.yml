services:
  atlas-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atlas-api
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_PORT: "8080"
      LOG_LEVEL: info
      DATABASE_HOST: timescaledb
      DATABASE_PORT: "5432"
      DATABASE_NAME: atlas
      DATABASE_USER: atlas
      # Both default to the same local-dev-only values this stack has always used — override in
      # .env (gitignored; copy .env.example to get started) rather than editing this file, so
      # real credentials never end up tracked in Git. DATABASE_PASSWORD must match
      # timescaledb's POSTGRES_PASSWORD below — they're the same variable for that reason.
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-atlas}
      # Empty means the pool defaults in persistence.PoolLimits (20 open, 5 idle, 30 minute
      # lifetime) — conservative starting points, not measured optima. Override in .env only if
      # a real deployment shows requests queuing for a connection.
      DATABASE_MAX_OPEN_CONNS: ${DATABASE_MAX_OPEN_CONNS:-}
      DATABASE_MAX_IDLE_CONNS: ${DATABASE_MAX_IDLE_CONNS:-}
      DATABASE_CONN_MAX_LIFETIME_MINUTES: ${DATABASE_CONN_MAX_LIFETIME_MINUTES:-}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Empty by default: this stack's Redis is on a private Compose network, published on
      # loopback only. Set REDIS_PASSWORD in .env and the redis service below picks up the same
      # value as its requirepass, so the two can't drift.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # Passed through so a deployment that does run TLS-enabled backends can say so; this stack's
      # own Postgres and Redis serve plaintext on the private Compose network, which is why the
      # defaults are off. REQUIRE_BACKEND_TLS is independent of COOKIE_SECURE below — see
      # .env.example's "Serving over HTTPS" section.
      DATABASE_SSLMODE: ${DATABASE_SSLMODE:-disable}
      REDIS_TLS: ${REDIS_TLS:-false}
      REQUIRE_BACKEND_TLS: ${REQUIRE_BACKEND_TLS:-false}
      # 0 keeps every recommendation/indicator/prediction row forever, which is fine for a
      # laptop run. Set a day count on anything long-lived (see config.DerivedRetentionDays).
      DERIVED_RETENTION_DAYS: ${DERIVED_RETENTION_DAYS:-0}
      # /health reports these three as purely informational (never affects its own status/HTTP
      # code — see internal/app/http_handler.go's healthHandler) — hardcoded in-network Compose
      # service names, same as DATABASE_HOST/REDIS_HOST above, not a `${VAR:-default}` override
      # slot: unlike TRAINER_URL below, there's no real deployment where these three would live
      # anywhere else within this same Compose stack.
      PROMETHEUS_URL: http://prometheus:9090
      ALERTMANAGER_URL: http://alertmanager:9093
      GRAFANA_URL: http://grafana:3000
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ALERT_POLL_INTERVAL_SECONDS: "300"
      # True by default (unchanged behavior). Set to "false" to make BUY/SELL/HOLD scoring use
      # the technical term alone (RSI/MACD/Bollinger/momentum), skipping the ML+Portfolio+Risk
      # blend entirely — MODEL_PATH/RECOVERY_MODEL_PATH below still load and stay usable via
      # /predict and the Account page either way, this only stops the decision engine from
      # factoring them in. See internal/config.Config.MLEnabled.
      ML_ENABLED: ${ML_ENABLED:-true}
      # Empty by default: no model loaded, Atlas falls back to the deterministic RSI stub
      # (non-fatal — see internal/application/ml). Set MODEL_PATH in the shell/.env before
      # `docker compose up` to enable real inference, e.g.:
      #   MODEL_PATH=/models/atlas-ml-v1.onnx docker compose up -d
      # referencing the *container* path under the training/models mount below, not the host
      # path — see training/README.md's step 4.
      MODEL_PATH: ${MODEL_PATH:-}
      # A separate, independently-optional model from MODEL_PATH above (RecoveryProbability
      # stays 0 if unset, the same non-fatal pattern) — e.g.:
      #   RECOVERY_MODEL_PATH=/models/atlas-ml-recovery-v1.onnx docker compose up -d
      RECOVERY_MODEL_PATH: ${RECOVERY_MODEL_PATH:-}
      # LIBONNXRUNTIME_PATH is intentionally not overridden here: the Dockerfile already sets
      # a working default (ENV LIBONNXRUNTIME_PATH=/usr/lib/libonnxruntime.so) matching where
      # it bundles the real onnxruntime .so; only override this if you rebuilt the image with
      # a different runtime location.
      # Both empty by default: no login gate at all (see internal/application/auth's Enabled),
      # matching every prior curl-based workflow this project already relies on. Set these in
      # the shell/.env before `docker compose up` to protect the web dashboard/API — use
      # `go run ./cmd/generate-admin-credentials` to produce a real hash, e.g.:
      #   ADMIN_USERNAME=admin ADMIN_PASSWORD_HASH='$2a$...' docker compose up -d
      # 2FA is not configured here at all: enable it from the dashboard after logging in
      # (Account → Set up 2FA), which walks through a real QR-code enrollment — see
      # internal/application/auth's doc comment.
      AUTH_DISABLED: ${AUTH_DISABLED:-true}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      # False by default, matching this stack running over plain HTTP with no reverse proxy in
      # front. Set to "true" once Atlas is actually served over HTTPS through a reverse proxy —
      # see .env.example's "Serving over HTTPS" section.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # The atlas-trainer service below runs as part of the default stack, so the Account page's
      # "Train new candidate" and model-delete buttons work out of the box. Set TRAINER_URL= (empty)
      # in .env to hide them; the page then explains how to run training/retrain.sh by hand.
      TRAINER_URL: ${TRAINER_URL-http://atlas-trainer:8091}
    volumes:
      # Read-only: lets MODEL_PATH above reference a locally-trained model (training/models/
      # is gitignored — these are locally/CI-generated artifacts, not committed source).
      - ./training/models:/models:ro
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  atlas-trainer:
    build:
      context: .
      dockerfile: training/Dockerfile
    container_name: atlas-trainer
    volumes:
      # Read-write, the whole repo: retrain.sh needs cmd/export-training-data's Go source and
      # training/train.py, and writes into training/data/ and training/models/ — the same
      # directory atlas-api's MODEL_PATH/RECOVERY_MODEL_PATH and Account-page picker already
      # read from (./training/models:/models:ro above). training/.venv (gitignored) persists
      # across restarts here exactly like it would running retrain.sh on the host directly.
      - .:/app
      # This service runs via `go run` (see training/Dockerfile), not a prebuilt binary, so
      # without a persistent module cache every container recreation (an image rebuild, or any
      # `docker compose up` after one) re-downloads the same ~15 Go dependencies from scratch —
      # confirmed live: ~25-30s of "go: downloading ..." on every fresh container, easy to mistake
      # for the service being stuck. /go/pkg/mod (not /root/go/pkg/mod — the golang:* base image
      # sets GOPATH=/go, confirmed via `go env GOMODCACHE` inside the container) lives outside the
      # /app bind mount above, so a named volume here persists across recreation with nothing
      # needed in Dockerfile.
      - trainer-gomod-cache:/go/pkg/mod
    environment:
      DATABASE_HOST: timescaledb
      DATABASE_PORT: "5432"
      DATABASE_NAME: atlas
      DATABASE_USER: atlas
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-atlas}
      # A separate venv directory from the one training/README.md's manual host steps use — a
      # venv's python3 is a symlink back to whichever interpreter created it, which doesn't
      # resolve if a venv created on the host OS gets bind-mounted into this (Linux) container.
      # Gitignored, like training/.venv itself (see .gitignore).
      TRAINING_VENV_DIR: training/.venv-container
      # cmd/trainer reads this directly for the one outcome worth a push: a training run that
      # failed (see cmd/trainer/main.go). A successful run only logs — training/retrain.sh used to
      # also push a "new candidates ready" notification on success, but that fired on every run
      # regardless of whether the candidate was any good, which made it noise rather than signal.
      # Deliberately reuses the *same* .env value as alertmanager's ALERTMANAGER_DISCORD_WEBHOOK_URL
      # below, not DISCORD_WEBHOOK_URL above (atlas-api's business-alert channel) — training
      # outcomes are an "is Atlas itself working" signal, same category as pod-down/error-rate
      # infra alerts, not an investment recommendation. One webhook URL in .env covers both.
      TRAINING_DISCORD_WEBHOOK_URL: ${ALERTMANAGER_DISCORD_WEBHOOK_URL:-}
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8091/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: atlas-timescaledb
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      # Must match atlas-api's DATABASE_PASSWORD above — same variable, same value.
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-atlas}
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      # Official postgres/timescaledb images auto-run any .sql files found here, in lexical
      # order, but only against a fresh (empty) data volume. That is no longer the only path:
      # atlas-api applies the same files itself on every start, under an advisory lock and
      # tracked in schema_migrations (see persistence.Migrate). This mount just means a brand-new
      # volume is already migrated by the time the API connects.
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: atlas-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # Same variable as atlas-api's REDIS_PASSWORD, so requirepass and the client credential can
    # never disagree. Unset means no password at all, rather than an empty one Redis rejects.
    command: ["sh", "-c", 'exec redis-server ${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}']
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli ${REDIS_PASSWORD:+-a "$$REDIS_PASSWORD"} ping']
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.0.0
    container_name: atlas-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - alertmanager

  alertmanager:
    # Pinned above v0.27.0 deliberately: confirmed live (and via prometheus/alertmanager's
    # source on GitHub) that v0.27.0 has a real bug where discord_configs' config-load
    # validation only checks WebhookURL, ignoring WebhookURLFile as a valid alternative even
    # though the field is otherwise fully supported — every webhook_url_file-only config fails
    # to load with "no discord webhook URL provided", regardless of the file's actual content.
    # Fixed in v0.28.0 (config.go's check became `WebhookURL == nil && len(WebhookURLFile) == 0`).
    image: prom/alertmanager:v0.28.1
    container_name: atlas-alertmanager
    environment:
      # Empty by default (non-fatal — see alertmanager/alertmanager.yml's comment): the pinned
      # v0.28.1 image's config-load validation only requires webhook_url_file's *path* to be
      # set (which it always is, hardcoded below), not the file's content — an empty file only
      # fails an actual notification-send attempt (logged, non-fatal), never config load.
      # Compose's secrets-from-environment feature was tried first instead but rejected: it
      # hard-fails container startup outright when the source env var is entirely unset, unlike
      # every other optional dependency in this project (ML model, business Discord alerts, NBP
      # rates), which all degrade gracefully instead of refusing to start.
      ALERTMANAGER_DISCORD_WEBHOOK_URL: ${ALERTMANAGER_DISCORD_WEBHOOK_URL:-}
    # Overrides the image's default entrypoint only to write that env var to a file first —
    # Alertmanager's config can't read env vars directly, only webhook_url_file (a path). The
    # `exec` line re-applies the image's own default CMD flags (see `docker inspect`).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo -n "$$ALERTMANAGER_DISCORD_WEBHOOK_URL" > /tmp/discord_webhook_url
        exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml --storage.path=/alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: atlas-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  timescaledb-data:
  redis-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  trainer-gomod-cache:
